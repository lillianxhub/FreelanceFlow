name: freelanceflow
services:
    postgres:
        image: postgres:16-alpine
        container_name: freelanceflow_db
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-freelanceflow}
            POSTGRES_USER: ${POSTGRES_USER:-freelanceflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-freelanceflow} -d ${POSTGRES_DB:-freelanceflow}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - freelanceflow-network

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: freelanceflow_app
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freelanceflow}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freelanceflow}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            SPRING_JPA_DEFAULT_SCHEMA: ${SPRING_JPA_DEFAULT_SCHEMA:-public}
            SPRING_FLYWAY_SCHEMAS: ${SPRING_FLYWAY_SCHEMAS:-${SPRING_JPA_DEFAULT_SCHEMA:-public}}
            SPRING_JPA_HIBERNATE_DDL_AUTO: validate
            SPRING_FLYWAY_ENABLED: true
            SPRING_FLYWAY_BASELINE_ON_MIGRATE: false
            PORT: ${PORT:-8080}
            JWT_SECRET: ${JWT_SECRET:?Set a new JWT_SECRET in .env}
            JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
            REFRESH_EXPIRATION_MS: ${REFRESH_EXPIRATION_MS:-604800000}
            REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
            OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
        ports:
            - "${APP_PORT:-8080}:${PORT:-8080}"
        networks:
            - freelanceflow-network
        restart: unless-stopped

volumes:
    postgres_data:

networks:
    freelanceflow-network:
        driver: bridge
