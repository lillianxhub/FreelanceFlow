name: freelanceflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelanceflow}
      POSTGRES_USER: ${POSTGRES_USER:-freelanceflow_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:?Set POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freelanceflow_app} -d ${POSTGRES_DB:-freelanceflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app]

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freelanceflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freelanceflow_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_JPA_DEFAULT_SCHEMA: public
      SPRING_FLYWAY_SCHEMAS: public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN}
      REFRESH_COOKIE_SECURE: "true"
      OPENAPI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [app]

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5174}:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [app]

networks:
  app:
