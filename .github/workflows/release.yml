name: Publish production images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify release commit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance_test -d finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: code/Backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/Frontend/package-lock.json
      - name: Backend checks including PostgreSQL Finance regressions
        working-directory: code/Backend
        env:
          FINANCE_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/finance_test
          FINANCE_TEST_DATABASE_USER: finance_test
          FINANCE_TEST_DATABASE_PASSWORD: finance_test
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Frontend checks
        working-directory: code/Frontend
        env:
          BACKEND_ORIGIN: http://localhost:8080
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Start release services
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finance_test
          SPRING_DATASOURCE_USERNAME: finance_test
          SPRING_DATASOURCE_PASSWORD: finance_test
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
          CORS_ALLOWED_ORIGINS: http://localhost:5174
          PORT: "8080"
        run: |
          nohup java -jar code/Backend/target/freelanceflow-0.0.1.jar > /tmp/freelanceflow-backend.log 2>&1 &
          nohup npm --prefix code/Frontend start > /tmp/freelanceflow-frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null && curl -fsS http://localhost:5174/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/freelanceflow-backend.log /tmp/freelanceflow-frontend.log
          exit 1
      - name: Verify login, refresh, and Finance through Next proxy
        working-directory: code/Frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/workspace.spec.ts e2e/finance-documents.spec.ts e2e/premium-trial.spec.ts --project=chromium --workers=1

  publish:
    name: Build and push images
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: code/Backend
            build_args: ""
          - component: frontend
            context: code/Frontend
            build_args: BACKEND_ORIGIN=http://backend:8080
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/freelanceflow-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/freelanceflow-${{ matrix.component }}:main
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release-gate:
    name: Release gate
    needs: [checks, publish]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success -a "${{ needs.publish.result }}" = success
