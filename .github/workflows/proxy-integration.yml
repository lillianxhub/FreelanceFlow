name: Proxy integration CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: proxy-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Login, refresh, and Finance through Next proxy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freelanceflow_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d freelanceflow_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: code/Backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/Frontend/package-lock.json
      - name: Build and start Backend
        working-directory: code/Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/freelanceflow_e2e
          SPRING_DATASOURCE_USERNAME: e2e
          SPRING_DATASOURCE_PASSWORD: e2e
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
          CORS_ALLOWED_ORIGINS: http://localhost:5174
          PORT: "8080"
        run: |
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          nohup java -jar target/freelanceflow-0.0.1.jar > /tmp/freelanceflow-backend.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:8080/actuator/health && exit 0; sleep 2; done
          cat /tmp/freelanceflow-backend.log
          exit 1
      - name: Build and start Frontend
        working-directory: code/Frontend
        env:
          BACKEND_ORIGIN: http://localhost:8080
        run: |
          npm ci
          npm run build
          nohup npm start > /tmp/freelanceflow-frontend.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:5174/login >/dev/null && exit 0; sleep 2; done
          cat /tmp/freelanceflow-frontend.log
          exit 1
      - name: Test login, refresh session, and Finance documents through /api
        working-directory: code/Frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/workspace.spec.ts e2e/finance-documents.spec.ts e2e/premium-trial.spec.ts --project=chromium --workers=1
      - name: Show service logs on failure
        if: failure()
        run: |
          cat /tmp/freelanceflow-backend.log || true
          cat /tmp/freelanceflow-frontend.log || true
