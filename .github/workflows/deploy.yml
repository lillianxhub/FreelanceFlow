name: Deploy homelab

on:
  workflow_run:
    workflows: [Publish production images]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA already published to GHCR
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: freelanceflow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, freelanceflow-production]
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
      - name: Install reviewed deployment files
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          install -d "$DEPLOY_PATH"
          install -m 0644 deploy/compose.prod.yml "$DEPLOY_PATH/compose.prod.yml"
          install -m 0755 deploy/backup.sh deploy/smoke.sh "$DEPLOY_PATH/"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Backup, migrate, and replace services
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          cd "$DEPLOY_PATH"
          test -f .env
          ./backup.sh "${{ vars.BACKUP_PATH }}"
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env -f compose.prod.yml pull
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env -f compose.prod.yml up -d --wait
          IMAGE_TAG="$IMAGE_TAG" ./smoke.sh "${{ vars.APP_ORIGIN }}"
